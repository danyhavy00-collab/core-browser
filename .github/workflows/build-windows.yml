name: Build Portable CORE Browser (Windows 11)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Windows Executable
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "CORE-Browser-Win11" --icon "core_icon.ico" --add-data "core_icon.png;." browser.py

      - name: Zip Portable Folder
        run: |
          Compress-Archive -Path dist/CORE-Browser-Win11 -DestinationPath CORE-Browser-Win11-Portable.zip

      - name: Upload Portable Zip
        uses: actions/upload-artifact@v4
        with:
          name: CORE-Browser-Win11-Portable
          path: CORE-Browser-Win11-Portable.zip
