name: Build Portable CORE Browser (Windows 11)

on:
  push:
    branches: [ "main" ]
    paths:
      - 'browser.py'
      - 'requirements.txt'
      - 'core_icon.*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: pyinstaller --noconfirm --onedir --windowed --name "CORE-Browser-Win11" --icon "core_icon.ico" --add-data "core_icon.png;." browser.py
      - run: Compress-Archive -Path dist/CORE-Browser-Win11 -DestinationPath CORE-Browser-Win11-Portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CORE-Browser-Win11-Portable
          path: CORE-Browser-Win11-Portable.zip
